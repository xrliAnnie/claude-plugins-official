name: Validate Discord Runtime

on:
  pull_request:
    paths:
      - "external_plugins/discord/**"
      - ".github/workflows/validate-discord-runtime.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: external_plugins/discord
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Discord runtime tests
        run: bun test
